<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tyti - Configuration Financière</title>
    <style>
        :root {
            --bg-color: #000000;
            --accent-green: #00ff66;
            --gray-text: #94a3b8;
            --gray-border: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #000000 25%, #051a0b 75%, #000000 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Loader de vérification au démarrage */
        #globalLoader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .phone-container {
            width: 100%;
            height: 100vh;
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            max-width: 500px;
        }

        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            text-align: center;
        }

        /* Photo de profil */
        .avatar-circle {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 2px solid var(--accent-green);
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.2);
            background: #020617;
        }

        .avatar-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Texte Professionnel */
        .config-message {
            font-size: 15px;
            line-height: 1.6;
            color: #ffffff;
            max-width: 300px;
        }

        .config-message span {
            color: var(--accent-green);
            font-weight: bold;
        }

        /* Zone de saisie du montant */
        .input-box {
            position: relative;
            width: 100%;
            max-width: 260px;
            border-bottom: 2px solid var(--gray-border);
            padding: 10px 0;
            transition: border-color 0.3s;
        }

        .input-box:focus-within {
            border-color: var(--accent-green);
        }

        .amount-input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: var(--accent-green);
            font-size: 32px;
            font-weight: 800;
            text-align: center;
        }

        /* Symbole monétaire */
        .currency-symbol {
            position: absolute;
            right: 0;
            bottom: 15px;
            font-size: 18px;
            color: var(--gray-text);
            font-weight: bold;
        }

        /* Bouton en bas à droite */
        .bottom-nav {
            display: flex;
            justify-content: flex-end;
            width: 100%;
        }

        .btn-finish {
            background-color: #020617;
            color: #475569;
            border: 1px solid var(--gray-border);
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 700;
            cursor: not-allowed;
            transition: all 0.3s;
        }

        .btn-finish.active {
            background-color: var(--accent-green);
            color: #000000;
            border-color: var(--accent-green);
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 255, 102, 0.3);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(0, 255, 102, 0.1);
            border-top-color: var(--accent-green);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
            /* --- SUPPRIMER LE BLEU APK --- */
        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            outline: none;
        }
    </style>
</head>
<body>

    <div id="globalLoader">
        <div class="spinner"></div>
    </div>

    <div class="phone-container">
        <div></div>

        <div class="main-content">
            <div class="avatar-circle" id="userPhoto">
                <img src="" id="photoImg" style="display:none;">
            </div>

            <p class="config-message" id="msgText">
                Fixez le montant quotidien que vous souhaitez épargner.
                Tyti calculera automatiquement votre projection finale en fonction de votre origine : <span id="originName">...</span>.
            </p>

            <div class="input-box">
                <input type="number" id="dailySum" class="amount-input" placeholder="0" inputmode="decimal">
                <div class="currency-symbol" id="currencyIcon">...</div>
            </div>
        </div>

        <div class="bottom-nav">
            <button class="btn-finish" id="btnFinish" disabled>Suivant</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBm-P3nrCQxf5fcnWOeKdatJcXqy6P3oxo",
            authDomain: "tyti-deaee.firebaseapp.com",
            projectId: "tyti-deaee",
            storageBucket: "tyti-deaee.firebasestorage.app",
            messagingSenderId: "668655272910",
            appId: "1:668655272910:web:296794f893e36784d2619f",
            measurementId: "G-CRLKTT8R27"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const currencyMap = {
            "France": "€",
            "RDC": "FC",
            "USA": "$",
            "Canada": "C$"
        };

        auth.onAuthStateChanged((user) => {
            if (user) {
                checkUserStatus(user.uid);
            } else {
                window.location.href = "connect.html";
            }
        });

        function checkUserStatus(uid) {
            db.collection("users").doc(uid).get().then((doc) => {
                if (doc.exists) {
                    const data = doc.data();

                    // Si le montant existe déjà -> Accueil direct
                    if (data.dailyAmount && data.dailyAmount > 0) {
                        window.location.href = "accueil.html";
                        return;
                    }

                    document.getElementById('globalLoader').style.display = 'none';

                    // Chargement Avatar
                    if (data.avatar) {
                        const img = document.getElementById('photoImg');
                        img.src = data.avatar;
                        img.style.display = 'block';
                    }

                    // Devise et Origine
                    const userOrigin = data.origin || "France";
                    document.getElementById('originName').textContent = userOrigin;
                    document.getElementById('currencyIcon').textContent = currencyMap[userOrigin] || "$";

                    // Gestion Multilingue (FR / EN / JA)
                    const lang = localStorage.getItem('tyti_lang') || 'fr';
                    if (lang === 'en') {
                        document.getElementById('msgText').innerHTML = "Set your daily savings goal. Tyti will automatically calculate your final projection based on your origin: <span>" + userOrigin + "</span>.";
                        document.getElementById('btnFinish').textContent = "Next";
                    } else if (lang === 'ja') {
                        document.getElementById('msgText').innerHTML = "毎日の貯蓄目標額を設定してください。Tytiが出身地（<span>" + userOrigin + "</span>）に基づいて最終的な予測を自動的に計算します。";
                        document.getElementById('btnFinish').textContent = "次へ";
                    }
                } else {
                    document.getElementById('globalLoader').style.display = 'none';
                }
            })
            .catch((error) => {
                console.error("Erreur Firebase :", error);
                document.getElementById('globalLoader').style.display = 'none';
            });
        }

        // Gestion Input Épargne
        const dailySumInput = document.getElementById('dailySum');
        const btnFinish = document.getElementById('btnFinish');

        dailySumInput.addEventListener('input', () => {
            if (dailySumInput.value > 0) {
                btnFinish.disabled = false;
                btnFinish.classList.add('active');
            } else {
                btnFinish.disabled = true;
                btnFinish.classList.remove('active');
            }
        });

        // Enregistrement final
        btnFinish.addEventListener('click', () => {
            const amount = parseFloat(dailySumInput.value);
            const user = auth.currentUser;

            if (user && amount > 0) {
                btnFinish.textContent = "...";
                db.collection("users").doc(user.uid).update({
                    dailyAmount: amount,
                    configCompleted: true,
                    currency: document.getElementById('currencyIcon').textContent
                }).then(() => {
                    window.location.href = "accueil.html";
                }).catch((err) => {
                    console.error("Erreur d'écriture :", err);
                    btnFinish.textContent = "Suivant";
                });
            }
        });
    </script>
</body>
</html>
