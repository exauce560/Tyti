<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tyti - Reconnexion</title>
    <style>
        :root {
            --bg-color: #000000;
            --accent-green: #00ff66; /* Vert premium électrique identique à profil.html */
            --accent-red: #ff3366;
            --gray-text: #94a3b8;
            --gray-border: #1e293b;
            --radius-main: 24px;
            --radius-card: 20px;
            --card-bg: radial-gradient(circle, #020617 0%, #000000 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #000000 25%, #051a0b 75%, #000000 100%),
                        radial-gradient(circle at 50% 50%, rgba(0, 255, 102, 0.12) 0%, transparent 60%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        .phone-container {
            width: 100%;
            height: 100vh;
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* HAUT : Titres et Navigation */
        .header-section {
            width: 100%;
        }

        .btn-back {
            cursor: pointer;
            background: none;
            border: none;
            padding: 4px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }

        .welcome-header-box {
            text-align: left;
        }

        .welcome-title {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            color: #ffffff;
        }

        .welcome-desc {
            font-size: 14px;
            color: var(--gray-text);
            line-height: 1.4;
        }

        /* MILIEU : Carte de Profil Premium ou Clavier */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            gap: 24px;
        }

        /* Carte Profil haut de gamme */
        .profile-card {
            display: none;
            background: var(--card-bg);
            border: 1px solid rgba(0, 255, 102, 0.2);
            border-radius: var(--radius-card);
            padding: 26px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 255, 102, 0.05);
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .verified-badge {
            position: absolute;
            top: 16px;
            right: 16px;
            background-color: rgba(0, 255, 102, 0.15);
            color: var(--accent-green);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .avatar-container {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 2px solid var(--gray-border);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #020617;
            margin-bottom: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar-placeholder {
            font-size: 40px;
        }

        .profile-name {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 16px;
        }

        .info-grid {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            border-top: 1px solid var(--gray-border);
            padding-top: 16px;
        }

        .info-item {
            background: #020617;
            border: 1px solid rgba(255,255,255,0.02);
            padding: 10px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .info-label {
            font-size: 10px;
            font-weight: 600;
            color: var(--gray-text);
            text-transform: uppercase;
        }

        .info-value {
            font-size: 13.5px;
            font-weight: 700;
            color: #ffffff;
        }

        .info-value img {
            width: 16px;
            height: auto;
            border-radius: 2px;
            margin-right: 5px;
            vertical-align: middle;
        }

        /* ZONE DE MOT DE PASSE ENTIÈREMENT EN ACCORD AVEC LE THÈME */
        .password-box {
            display: none;
            background: rgba(2, 6, 23, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 255, 102, 0.2);
            border-radius: var(--radius-card);
            padding: 30px 24px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 30px rgba(0, 255, 102, 0.05);
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            flex-direction: column;
            gap: 20px;
            text-align: center;
        }

        .password-box label {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            color: #ffffff;
            letter-spacing: 0.8px;
        }

        .pin-input {
            width: 100%;
            padding: 18px 50px 18px 20px;
            border-radius: 16px;
            border: 1px solid var(--gray-border);
            background: #000000;
            font-size: 22px;
            color: var(--accent-green);
            text-align: center;
            letter-spacing: 6px;
            outline: none;
            font-weight: 700;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }

        .pin-input:focus {
            border-color: var(--accent-green);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5), 0 0 15px rgba(0, 255, 102, 0.25);
        }

        .toggle-password {
            position: absolute;
            right: 16px;
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
        }

        .toggle-password svg {
            stroke: var(--gray-text);
            transition: stroke 0.2s;
        }

        .toggle-password:active svg {
            stroke: var(--accent-green);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* BAS : Actions & Boutons équilibrés */
        .bottom-section {
            width: 100%;
            margin-bottom: 20px;
        }

        .btn-google-auth {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            height: 54px;
            background-color: #020617;
            color: #ffffff;
            border: 1px solid var(--gray-border);
            border-radius: var(--radius-main);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-google-auth:active {
            transform: scale(0.98);
            background-color: #1e293b;
        }

        .google-icon { width: 22px; height: 22px; }

        .btn-confirm, .btn-submit-pass {
            display: none;
            width: 100%;
            height: 54px;
            background-color: var(--accent-green);
            color: #000000;
            border: none;
            border-radius: var(--radius-main);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 255, 102, 0.3);
            transition: all 0.2s;
        }

        .btn-confirm:active, .btn-submit-pass:active {
            transform: scale(0.98);
        }

        .spinner {
            display: none;
            width: 26px;
            height: 26px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: var(--accent-green);
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .toast {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background-color: #020617;
            border: 1px solid var(--gray-border);
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }
            /* --- SUPPRIMER LE BLEU APK --- */
        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            outline: none;
        }
    </style>
</head>
<body>

    <div class="phone-container">

        <div class="header-section">
            <button class="btn-back" id="backBtn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <div class="welcome-header-box">
                <h2 class="welcome-title" id="lblTitle">Reconnexion</h2>
                <p class="welcome-desc" id="lblDesc">Identifiez-vous pour synchroniser vos données sécurisées.</p>
            </div>
        </div>

        <div class="main-content">
            <div class="profile-card" id="profileCard">
                <div class="verified-badge" id="lblVerified">Validé</div>

                <div class="avatar-container" id="avatarBox"></div>

                <div class="profile-name" id="profName">---</div>

                <div class="info-grid">
                    <div class="info-item">
                        <span class="info-label" id="lblGender">Sexe</span>
                        <span class="info-value" id="profGender">---</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label" id="lblBirth">Naissance</span>
                        <span class="info-value" id="profBirth">---</span>
                    </div>
                    <div class="info-item" style="grid-column: span 2;">
                        <span class="info-label" id="lblCountry">Origine</span>
                        <span class="info-value">
                            <img id="profFlag" src="" alt="" style="display:none;">
                            <span id="profCountry">---</span>
                        </span>
                    </div>
                </div>
            </div>

            <div class="password-box" id="passwordBox">
                <label for="appPassword" id="lblPassPrompt">Saisir votre Code PIN à chiffres</label>
                <div class="input-wrapper">
                    <input type="password" id="appPassword" class="pin-input" placeholder="••••" pattern="[0-9]*" inputmode="numeric" maxlength="4">
                    <button type="button" class="toggle-password" id="togglePasswordBtn">
                        <svg id="eyeIcon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path><path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path><line x1="2" y1="2" x2="22" y2="22"></line></svg>
                    </button>
                </div>
            </div>

            <div class="spinner" id="loader"></div>
        </div>

        <div class="bottom-section">
            <button class="btn-google-auth" id="reconnectGoogleBtn">
                <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <span id="txtGoogleBtn">Se connecter avec Google</span>
            </button>

            <button class="btn-confirm" id="confirmBtn">OK</button>
            <button class="btn-submit-pass" id="submitPassBtn">Vérifier le Code</button>
        </div>

    </div>

    <div id="toast" class="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBm-P3nrCQxf5fcnWOeKdatJcXqy6P3oxo",
        authDomain: "tyti-deaee.firebaseapp.com",
        projectId: "tyti-deaee",
        storageBucket: "tyti-deaee.firebasestorage.app",
        messagingSenderId: "668655272910",
        appId: "1:668655272910:web:296794f893e36784d2619f",
        measurementId: "G-CRLKTT8R27"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const reconnectGoogleBtn = document.getElementById('reconnectGoogleBtn');
    const confirmBtn = document.getElementById('confirmBtn');
    const submitPassBtn = document.getElementById('submitPassBtn');
    const profileCard = document.getElementById('profileCard');
    const passwordBox = document.getElementById('passwordBox');
    const avatarBox = document.getElementById('avatarBox');
    const loader = document.getElementById('loader');
    const toast = document.getElementById('toast');
    const appPassword = document.getElementById('appPassword');
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    const eyeIcon = document.getElementById('eyeIcon');

    let uiTranslations = {
        noAccount: "Compte introuvable. Veuillez d'abord vous inscrire.",
        authError: "Échec de l'authentification Google.",
        dbError: "Erreur lors de l'accès à la base de données.",
        emptyPin: "Veuillez saisir votre code PIN.",
        wrongPin: "Code PIN incorrect. Accès refusé."
    };

    document.addEventListener("DOMContentLoaded", () => {
        appPassword.setAttribute('maxlength', '4');
        appPassword.placeholder = "••••";

        const currentLang = localStorage.getItem('tyti_lang') || 'fr';
        if(currentLang === 'en') {
            document.getElementById('lblTitle').textContent = "Reconnection";
            document.getElementById('lblDesc').textContent = "Please sign in to sync your secure data.";
            document.getElementById('txtGoogleBtn').textContent = "Log in with Google";
            document.getElementById('lblVerified').textContent = "Verified";
            document.getElementById('lblGender').textContent = "Gender";
            document.getElementById('lblBirth').textContent = "Birthdate";
            document.getElementById('lblCountry').textContent = "Origin";
            document.getElementById('lblPassPrompt').textContent = "Enter your 4-digit PIN code";
            document.getElementById('submitPassBtn').textContent = "Verify Code";
            uiTranslations.noAccount = "Account not found. Please sign up first.";
            uiTranslations.authError = "Google authentication failed.";
            uiTranslations.dbError = "Error accessing the database.";
            uiTranslations.emptyPin = "Please enter your PIN code.";
            uiTranslations.wrongPin = "Incorrect PIN code. Access denied.";
        } else if(currentLang === 'ja') {
            document.getElementById('lblTitle').textContent = "再接続";
            document.getElementById('lblDesc').textContent = "安全にデータを同期するためにサインインしてください。";
            document.getElementById('txtGoogleBtn').textContent = "Googleでログイン";
            document.getElementById('lblVerified').textContent = "確認済み";
            document.getElementById('lblGender').textContent = "性別";
            document.getElementById('lblBirth').textContent = "生年月日";
            document.getElementById('lblCountry').textContent = "出身地";
            document.getElementById('lblPassPrompt').textContent = "4桁のPINコードを入力してください";
            document.getElementById('submitPassBtn').textContent = "コードを確認";
            uiTranslations.noAccount = "アカウントが見つかりません。まず新規登録を行ってください。";
            uiTranslations.authError = "Google認証に失敗しました。";
            uiTranslations.dbError = "データベースへのアクセス中にエラーが発生しました。";
            uiTranslations.emptyPin = "PINコードを入力してください。";
            uiTranslations.wrongPin = "PINコードが正しくありません。";
        }
    });

    appPassword.addEventListener('input', () => {
        appPassword.value = appPassword.value.replace(/[^0-9]/g, '');
    });

    togglePasswordBtn.addEventListener('click', () => {
        if (appPassword.type === "password") {
            appPassword.type = "text";
            eyeIcon.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`;
        } else {
            appPassword.type = "password";
            eyeIcon.innerHTML = `<path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path><path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path><line x1="2" y1="2" x2="22" y2="22"></line>`;
        }
    });

    document.getElementById('backBtn').addEventListener('click', () => {
        window.location.href = "welc.html";
    });

    function showToast(message) {
        toast.textContent = message;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3500);
    }

    const flagMap = { "USA": "us", "RDC": "cd", "France": "fr", "Canada": "ca" };

    reconnectGoogleBtn.addEventListener('click', () => {
        loader.style.display = 'block';
        profileCard.style.display = 'none';
        confirmBtn.style.display = 'none';

        const provider = new firebase.auth.GoogleAuthProvider();

        auth.signInWithPopup(provider)
            .then((result) => {
                const user = result.user;

                db.collection("users").doc(user.uid).get()
                    .then((doc) => {
                        loader.style.display = 'none';

                        if (doc.exists) {
                            const data = doc.data();

                            document.getElementById('profName').textContent = data.name || "---";
                            document.getElementById('profGender').textContent = data.gender || "---";
                            document.getElementById('profBirth').textContent = data.birthDate || "---";
                            document.getElementById('profCountry').textContent = data.origin || "---";

                            avatarBox.innerHTML = "";
                            if(data.avatar) {
                                const img = document.createElement('img');
                                img.src = data.avatar;
                                img.className = "avatar-img";
                                avatarBox.appendChild(img);
                            } else {
                                const span = document.createElement('span');
                                span.className = "avatar-placeholder";
                                span.textContent = "👤";
                                avatarBox.appendChild(span);
                            }

                            const codeFlag = flagMap[data.origin];
                            if(codeFlag) {
                                const flagImg = document.getElementById('profFlag');
                                flagImg.src = `https://flagcdn.com/w40/${codeFlag}.png`;
                                flagImg.style.display = 'inline';
                            }

                            profileCard.style.display = 'flex';
                            confirmBtn.style.display = 'block';
                            reconnectGoogleBtn.style.display = 'none';

                            localStorage.setItem('tyti_temp_reconnect_uid', user.uid);
                        } else {
                            showToast(uiTranslations.noAccount);
                        }
                    })
                    .catch((err) => {
                        loader.style.display = 'none';
                        showToast(uiTranslations.dbError);
                    });
            })
            .catch((error) => {
                loader.style.display = 'none';
                showToast(uiTranslations.authError);
            });
    });

    confirmBtn.addEventListener('click', () => {
        profileCard.style.display = 'none';
        confirmBtn.style.display = 'none';
        passwordBox.style.display = 'flex';
        submitPassBtn.style.display = 'block';
    });

    submitPassBtn.addEventListener('click', () => {
        const passVal = appPassword.value.trim();
        const cachedUid = localStorage.getItem('tyti_temp_reconnect_uid');

        if(passVal === "") {
            showToast(uiTranslations.emptyPin);
            return;
        }

        if(!cachedUid) {
            showToast(uiTranslations.authError);
            return;
        }

        loader.style.display = 'block';
        submitPassBtn.style.display = 'none';

        db.collection("users").doc(cachedUid).get()
            .then((doc) => {
                loader.style.display = 'none';
                submitPassBtn.style.display = 'block';

                if (doc.exists) {
                    const dbPin = doc.data().pinCode;

                    if (passVal === dbPin) {
                        // --- ENREGISTREMENT DE LA CONNEXION ---
                        localStorage.setItem('tyti_app_pin', passVal);
                        localStorage.setItem('tyti_connecte', 'true'); // Active l'état connecté localement !

                        localStorage.removeItem('tyti_temp_reconnect_uid');
                        window.location.href = "conf.html";
                    } else {
                        showToast(uiTranslations.wrongPin);
                        appPassword.value = "";
                    }
                } else {
                    showToast(uiTranslations.noAccount);
                }
            })
            .catch((err) => {
                loader.style.display = 'none';
                submitPassBtn.style.display = 'block';
                showToast(uiTranslations.dbError);
            });
    });
</script>
</body>
</html>
