<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tyti - Confidentialité</title>
    <style>
        /* FOND STRICTEMENT BLANC */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #ffffff;
            color: #0c1a12;
            padding: 16px 20px 60px 20px;
            min-height: 100vh;
        }

        .back-arrow {
            display: inline-block;
            text-decoration: none;
            color: #ff6600; /* Orange Tark */
            font-size: 24px;
            margin-bottom: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        .center-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 16px;
            margin-bottom: 24px;
        }

        /* Conteneur adapté pour accueillir ton logo SVG sur mesure */
        .logo-php-container {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 2px solid #ffcc00; /* Jaune Tark */
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            box-shadow: 0 4px 12px rgba(255, 102, 0, 0.05);
            padding: 10px;
        }

        .logo-php-container svg {
            width: 100%;
            height: 100%;
        }

        .main-desc {
            font-size: 15px;
            line-height: 1.4;
            color: #0c1a12;
            font-weight: 500;
            max-width: 290px;
        }

        /* Cadre de groupe - Style Unique Tark */
        .meta-box {
            background: #ffffff;
            border: 1px solid rgba(0, 0, 0, 0.12);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.02);
        }

        .meta-item {
            display: flex;
            flex-direction: column;
            padding: 18px 20px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            text-align: left;
            background: none;
            border-left: none;
            border-right: none;
            border-top: none;
            width: 100%;
            cursor: pointer;
            transition: background 0.1s;
        }

        .meta-item:active {
            background: rgba(255, 204, 0, 0.06); /* Feedback Jaune léger */
        }

        .meta-item:last-child {
            border-bottom: none;
        }

        .meta-label {
            font-size: 14px;
            font-weight: 700;
            color: #1e73be; /* Bleu Tark */
            margin-bottom: 3px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .meta-value {
            font-size: 15px;
            color: #0c1a12;
            word-break: break-all;
        }

        .meta-item.danger .meta-label {
            color: #ff6600; /* Déconnexion en Orange Tark */
        }

        /* En savoir plus à gauche et Nouveau Logo Tark au milieu en bas */
        .more-info-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: flex-start; /* Aligne le contenu initial à gauche */
            margin-top: 40px;
            padding: 0 4px;
            height: 45px;
        }

        .btn-more-info {
            font-size: 14px;
            color: #1e73be; /* Bleu Tark */
            text-decoration: underline;
            font-weight: 600;
            cursor: pointer;
            background: none;
            border: none;
            z-index: 2;
        }

        /* Force le logo Tark officiel à être centré de manière absolue au milieu du conteneur */
        .tark-official-logo {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 45px;
            height: 45px;
            z-index: 1;
        }

        /* Application du dégradé tricolore Tark */
        .tark-official-logo path {
            fill: url(#tarkPrivacyGradient);
        }

        /* ==================== COMPOSANT SMART TOAST MOBILE TARK ==================== */
        .toast-notification {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1e73be; /* Fond Bleu Tark */
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 6px 20px rgba(30, 115, 190, 0.3);
            z-index: 2000;
            opacity: 0;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
            white-space: nowrap;
            pointer-events: none;
            border: 1px solid #ffcc00; /* Ligne de contour jaune */
        }
        .toast-notification.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
            /* --- SUPPRIMER LE BLEU APK --- */
        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            outline: none;
        }
    </style>
</head>

    <div class="toast-notification" id="appToast">Message</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBm-P3nrCQxf5fcnWOeKdatJcXqy6P3oxo",
        authDomain: "tyti-deaee.firebaseapp.com",
        projectId: "tyti-deaee",
        storageBucket: "tyti-deaee.firebasestorage.app",
        messagingSenderId: "668655272910",
        appId: "1:668655272910:web:296794f893e36784d2619f"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    function showToast(text) {
        const toast = document.getElementById('appToast');
        toast.textContent = text;
        toast.classList.add('show');
        setTimeout(() => {
            toast.classList.remove('show');
        }, 3000);
    }

    function maskCode(code) {
        if (!code) return "Aucun code";
        return "• ".repeat(code.length).trim();
    }

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            document.getElementById('valEmail').textContent = user.email;

            try {
                const userDocRef = doc(db, "users", user.uid);
                const userDocSnap = await getDoc(userDocRef);

                if (userDocSnap.exists()) {
                    const userData = userDocSnap.data();
                    if (userData.pinCode) {
                        document.getElementById('valCodeApp').textContent = maskCode(userData.pinCode);
                        localStorage.setItem('pinCode', userData.pinCode);
                    } else {
                        document.getElementById('valCodeApp').textContent = "Aucun code";
                    }
                } else {
                    document.getElementById('valCodeApp').textContent = "Aucun code";
                }
            } catch (error) {
                console.error(error);
                const localPin = localStorage.getItem('pinCode');
                document.getElementById('valCodeApp').textContent = localPin ? maskCode(localPin) : "Aucun code";
            }
        } else {
            window.location.href = "index.html";
        }
    });

    document.getElementById('btnEmailRow').addEventListener('click', (e) => {
        e.preventDefault();
        window.location.href = "comptes_liste.html";
    });

    document.getElementById('btnCodeRow').addEventListener('click', (e) => {
        e.preventDefault();
        showToast("Ouverture de l'éditeur...");
        setTimeout(() => {
            window.location.href = "emailpasword.html";
        }, 800);
    });

    document.getElementById('btnActionLogout').addEventListener('click', async (e) => {
        e.preventDefault();
        await signOut(auth);
        localStorage.clear();
        window.location.href = "index.html";
    });

    document.getElementById('btnMoreInfo').addEventListener('click', (e) => {
        e.preventDefault();
        showToast("Tark sécurise l'écosystème de vos données.");
    });
</script>
