<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tark - Modifier le Code PIN</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #ffffff;
            color: #0c1a12;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 16px;
        }

        .pin-card {
            background: #ffffff;
            width: 100%;
            max-width: 360px;
            border: 2px solid #ffcc00; /* Jaune Tark */
            border-radius: 20px;
            padding: 24px 20px;
            box-shadow: 0 8px 24px rgba(255, 102, 0, 0.06);
            text-align: center;
            position: relative;
        }

        .back-btn {
            position: absolute;
            top: 16px;
            left: 16px;
            background: none;
            border: none;
            font-size: 20px;
            color: #ff6600; /* Orange Tark */
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
        }

        .logo-container {
            width: 75px;
            height: 75px;
            margin: 10px auto 16px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tark-logo-svg {
            width: 100%;
            height: 100%;
        }

        .page-title {
            font-size: 20px;
            font-weight: 700;
            color: #0c1a12;
            margin-bottom: 6px;
        }

        .page-subtitle {
            font-size: 13px;
            color: #5a6e63;
            margin-bottom: 24px;
            line-height: 1.4;
        }

        .step-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            text-align: left;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label {
            font-size: 12px;
            font-weight: 700;
            color: #1e73be; /* Bleu Tark */
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            letter-spacing: 8px;
            text-align: center;
            background: #ffffff;
            border: 1px solid rgba(0, 0, 0, 0.15);
            border-radius: 12px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            border-color: #ff6600; /* Focus Orange Tark */
        }

        /* Enlever les flèches des inputs de type number */
        .form-input::-webkit-outer-spin-button,
        .form-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .form-input[type=number] {
            -moz-appearance: textfield;
        }

        .btn-tark {
            width: 100%;
            padding: 14px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: background 0.2s, transform 0.1s;
            margin-top: 10px;
            letter-spacing: 0px;
        }

        .btn-blue {
            background: #1e73be;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(30, 115, 190, 0.2);
        }
        .btn-blue:active {
            background: #155a96;
            transform: scale(0.98);
        }

        .btn-orange {
            background: #ff6600;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(255, 102, 0, 0.2);
        }
        .btn-orange:active {
            background: #d45500;
            transform: scale(0.98);
        }

        .toast-notification {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1e73be;
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 6px 20px rgba(30, 115, 190, 0.3);
            z-index: 2000;
            opacity: 0;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
            white-space: nowrap;
            pointer-events: none;
            border: 1px solid #ffcc00;
        }
        .toast-notification.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
            /* --- SUPPRIMER LE BLEU APK --- */
        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            outline: none;
        }
    </style>
</head>
<body>

    <div class="pin-card">
        <a href="confidential.html" class="back-btn">❮</a>

        </div>

        <h1 class="page-title" id="pageTitle">Sécurité Tark</h1>
        <p class="page-subtitle" id="pageSubtitle">Veuillez d'abord saisir votre code PIN actuel pour autoriser la modification.</p>

        <div id="stepVerify" class="step-container">
            <div class="form-group">
                <label class="form-label">Code PIN Actuel (4 chiffres)</label>
                <input type="number" id="oldPinCode" class="form-input" placeholder="••••" inputmode="numeric" oninput="if(this.value.length > 4) this.value = this.value.slice(0,4);">
            </div>
            <button type="button" id="btnVerifyPin" class="btn-tark btn-blue">Vérifier la cohérence</button>
        </div>

        <div id="stepUpdate" class="step-container" style="display: none;">
            <div class="form-group">
                <label class="form-label">Nouveau Code PIN (4 chiffres)</label>
                <input type="number" id="newPinCode" class="form-input" placeholder="••••" inputmode="numeric" oninput="if(this.value.length > 4) this.value = this.value.slice(0,4);">
            </div>
            <button type="button" id="btnSavePin" class="btn-tark btn-orange">Enregistrer le nouveau code</button>
        </div>
    </div>

    <div class="toast-notification" id="appToast">Message</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBm-P3nrCQxf5fcnWOeKdatJcXqy6P3oxo",
        authDomain: "tyti-deaee.firebaseapp.com",
        projectId: "tyti-deaee",
        storageBucket: "tyti-deaee.firebasestorage.app",
        messagingSenderId: "668655272910",
        appId: "1:668655272910:web:296794f893e36784d2619f"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    let activeUser = null;
    let pinCodeDb = null;

    function showToast(text) {
        const toast = document.getElementById('appToast');
        toast.textContent = text;
        toast.classList.add('show');
        setTimeout(() => {
            toast.classList.remove('show');
        }, 3000);
    }

    // --- RÉCUPÉRATION DE L'UID ACTIF ---
    let activeUid = localStorage.getItem('tyti_active_uid');

    // Fonction isolée pour charger le PIN du compte actif
    async function chargerPinDuCompte(uid) {
        try {
            const userDocRef = doc(db, "users", uid);
            const userDocSnap = await getDoc(userDocRef);
            if (userDocSnap.exists()) {
                pinCodeDb = userDocSnap.data().pinCode;
            }
        } catch (error) {
            console.error("Erreur de chargement Firestore :", error);
        }
    }

    onAuthStateChanged(auth, async (user) => {
        // Interception multi-compte : On donne la priorité à l'UID du LocalStorage
        if (user && activeUid && user.uid !== activeUid) {
            user = null;
        }

        if (user) {
            activeUser = user;
            activeUid = user.uid;
            localStorage.setItem('tyti_active_uid', activeUid);
            await chargerPinDuCompte(user.uid);
        } else {
            // Section de secours si on utilise le second compte stocké localement
            if (activeUid) {
                activeUser = { uid: activeUid };
                await chargerPinDuCompte(activeUid);
            } else {
                window.location.href = "index.html";
            }
        }
    });

    document.getElementById('btnVerifyPin').addEventListener('click', () => {
        const inputOldPin = document.getElementById('oldPinCode').value;

        if (!inputOldPin || inputOldPin.length !== 4) {
            showToast("Veuillez saisir un code PIN à 4 chiffres.");
            return;
        }

        if (String(inputOldPin) === String(pinCodeDb)) {
            showToast("Données cohérentes !");

            document.getElementById('stepVerify').style.display = "none";
            document.getElementById('stepUpdate').style.display = "flex";

            document.getElementById('pageTitle').textContent = "Renouvellement du code";
            document.getElementById('pageSubtitle').textContent = "Saisissez à présent votre nouveau code d'accès à 4 chiffres.";
        } else {
            showToast("Code PIN actuel incorrect.");
        }
    });

    document.getElementById('btnSavePin').addEventListener('click', async () => {
        const newPin = document.getElementById('newPinCode').value;

        if (!newPin || newPin.length !== 4) {
            showToast("Le nouveau code doit contenir exactement 4 chiffres.");
            return;
        }

        try {
            const userDocRef = doc(db, "users", activeUser.uid);
            await updateDoc(userDocRef, {
                pinCode: newPin,
                pinUpdatedAt: new Date().toISOString()
            });

            localStorage.setItem('pinCode', newPin);
            showToast("Code PIN renouvelé avec succès !");

            setTimeout(() => {
                window.location.href = "confidential.html";
            }, 1500);

        } catch (error) {
            console.error(error);
            showToast("Erreur lors de la mise à jour sur Firebase.");
        }
    });
</script>
