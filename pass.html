<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tark - Connexion PIN</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d1117; /* Fond sombre Tark */
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
        }

        /* Conteneur du Logo SVG avec fond blanc */
        .logo-wrapper {
            width: 90px;
            height: 90px;
            background-color: #ffffff;
            border-radius: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            box-shadow: 0 8px 24px rgba(255, 255, 255, 0.1);
            margin-bottom: 32px;
            animation: fadeIn 0.6s ease-out;
        }

        .logo-wrapper svg {
            width: 100%;
            height: 100%;
        }

        h2 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        p.instruction {
            color: #8b949e;
            font-size: 14px;
            margin-bottom: 32px;
        }

        /* Zone centrale dynamique (contient soit les inputs, soit le loader) */
        .interactive-zone {
            position: relative;
            min-height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            margin-bottom: 24px;
        }

        /* Zone de saisie des 4 carrés */
        .pin-wrapper {
            display: flex;
            gap: 16px;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .pin-wrapper.hide {
            opacity: 0;
            transform: scale(0.9);
            pointer-events: none;
        }

        .pin-input {
            width: 64px;
            height: 64px;
            background-color: #161b22;
            border: 2px solid #30363d;
            border-radius: 16px;
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
            outline: none;
            transition: all 0.2s ease;
        }

        /* Couleurs dynamiques Tark au focus sur chaque carré */
        .pin-input:nth-child(1):focus { border-color: #58a6ff; box-shadow: 0 0 12px rgba(88, 166, 255, 0.3); } /* Bleu */
        .pin-input:nth-child(2):focus { border-color: #f78166; box-shadow: 0 0 12px rgba(247, 129, 102, 0.3); } /* Orange */
        .pin-input:nth-child(3):focus { border-color: #f2cc60; box-shadow: 0 0 12px rgba(242, 204, 96, 0.3); }  /* Jaune */
        .pin-input:nth-child(4):focus { border-color: #58a6ff; box-shadow: 0 0 12px rgba(88, 166, 255, 0.3); } /* Bleu */

        /* Cercle de connexion animé (Loader Orange, Jaune, Bleu) */
        .connection-loader {
            position: absolute;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            /* Dégradé conique reprenant l'écosystème Tark */
            background: conic-gradient(#f78166, #f2cc60, #58a6ff, #f78166);
            -webkit-mask: radial-gradient(farthest-side, transparent 75%, #000 76%);
            mask: radial-gradient(farthest-side, transparent 75%, #000 76%);
            animation: spin 1s linear infinite;
            opacity: 0;
            transform: scale(0.5);
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none;
        }

        .connection-loader.show {
            opacity: 1;
            transform: scale(1);
        }

        /* Message d'erreur */
        .error-message {
            color: #ff7b72;
            font-size: 14px;
            min-height: 20px;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .error-message.show {
            opacity: 1;
            animation: shake 0.4s ease-in-out;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }
            /* --- SUPPRIMER LE BLEU APK --- */
        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            outline: none;
        }
    </style>
</head>

        <h2>Saisissez votre code PIN</h2>
        <p class="instruction">Entrez votre code à 4 chiffres pour accéder à l'application.</p>

        <div class="interactive-zone">
            <div class="pin-wrapper" id="pinWrapper">
                <input type="text" class="pin-input" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
                <input type="text" class="pin-input" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
                <input type="text" class="pin-input" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
                <input type="text" class="pin-input" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
            </div>

            <div class="connection-loader" id="loader"></div>
        </div>

        <div class="error-message" id="errorMessage">Code PIN incorrect. Veuillez réessayer.</div>
    </div>

<script>
    const inputs = document.querySelectorAll('.pin-input');
    const pinWrapper = document.getElementById('pinWrapper');
    const loader = document.getElementById('loader');
    const errorMessage = document.getElementById('errorMessage');

    // Force le focus initial
    inputs[0].focus();

    inputs.forEach((input, index) => {
        input.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/[^0-9]/g, '');

            if (e.target.value.length === 1) {
                errorMessage.classList.remove('show');
                if (index < inputs.length - 1) {
                    inputs[index + 1].focus();
                } else {
                    // Le code est complet, on lance l'effet de connexion
                    startConnectionProcess();
                }
            }
        });

        input.addEventListener('keydown', (e) => {
            if (e.key === "Backspace" && input.value.length === 0 && index > 0) {
                inputs[index - 1].focus();
            }
        });
    });

    function startConnectionProcess() {
        // Masque les 4 carrés et affiche le cercle animé Tark
        pinWrapper.classList.add('hide');
        loader.classList.add('show');

        // Récupère le code saisi
        let enteredPin = "";
        inputs.forEach(input => enteredPin += input.value);

        // Simulation d'un temps de connexion (1.5 seconde) pour apprécier l'animation
        setTimeout(() => {
            // --- MODIFICATION MULTI-COMPTE : RÉCUPÉRATION DU PIN DU COMPTE SELECTIONNÉ ---
            const activeUid = localStorage.getItem('tyti_active_uid');

            // On cherche la clé du PIN associée à cet UID précis (ex: tyti_app_pin_MON_UID)
            // Si elle n'existe pas, on prend le PIN par défaut par sécurité
            const pinKey = activeUid ? `tyti_app_pin_${activeUid}` : 'tyti_app_pin';
            const savedPin = localStorage.getItem(pinKey) || localStorage.getItem('tyti_app_pin');

            if (enteredPin === savedPin) {
                localStorage.setItem('tyti_connecte', 'true');
                window.location.href = 'accueil.html';
            } else {
                // Si erreur : On masque le loader, réaffiche la grille, et secoue
                loader.classList.remove('show');
                pinWrapper.classList.remove('hide');
                errorMessage.classList.add('show');

                // Reset des inputs
                inputs.forEach(input => input.value = "");
                inputs[0].focus();
            }
        }, 1500);
    }
</script>
