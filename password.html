<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tyti - Configuration PIN</title>
    <style>
        :root {
            --bg-color: #000000;
            --accent-green: #00ff66; /* Vert premium électrique */
            --gray-text: #94a3b8;
            --gray-border: #1e293b;
            --radius-main: 24px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            /* FOND SIGNATURE : Vert Électrique et Noir Uniquement */
            background: linear-gradient(135deg, #000000 25%, #051a0b 75%, #000000 100%),
                        radial-gradient(circle at 50% 50%, rgba(0, 255, 102, 0.12) 0%, transparent 60%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        .phone-container {
            width: 100%;
            height: 100vh;
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Conteneur Principal basé sur ton croquis */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 28px;
            text-align: center;
            width: 100%;
        }

        /* Grand Rond pour la photo de profil de l'utilisateur */
        .avatar-display-zone {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 3px solid var(--accent-green);
            box-shadow: 0 0 25px rgba(0, 255, 102, 0.25);
            overflow: hidden;
            background: #020617;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar-placeholder {
            font-size: 64px;
        }

        /* Message de sécurité au milieu */
        .security-message {
            font-size: 14px;
            color: #ffffff;
            max-width: 290px;
            line-height: 1.5;
            font-weight: 500;
        }

        /* Zone d'input du Code PIN (Rectangle de ton croquis) */
        .input-wrapper {
            position: relative;
            width: 100%;
            max-width: 280px;
        }

        .pin-input {
            width: 100%;
            padding: 16px 50px 16px 20px;
            border-radius: 14px;
            border: 1px solid var(--gray-border);
            background: #000000;
            font-size: 24px;
            color: var(--accent-green);
            text-align: center;
            letter-spacing: 10px;
            outline: none;
            font-weight: 700;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }

        .pin-input:focus {
            border-color: var(--accent-green);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5), 0 0 15px rgba(0, 255, 102, 0.2);
        }

        /* Bouton œil (SVG de ton croquis) */
        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toggle-password svg {
            stroke: var(--gray-text);
            transition: stroke 0.2s;
        }

        /* Bouton d'action en bas à droite */
        .bottom-action-container {
            display: flex;
            justify-content: flex-end;
            width: 100%;
        }

        .btn-submit {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 120px;
            height: 48px;
            background-color: #020617;
            color: #475569;
            border: 1px solid var(--gray-border);
            border-radius: 24px;
            font-size: 14px;
            font-weight: 700;
            cursor: not-allowed;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-submit.active {
            background-color: var(--accent-green);
            color: #000000;
            border-color: var(--accent-green);
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 255, 102, 0.3);
        }

        .btn-submit.active:hover {
            transform: translateY(-2px);
        }

        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            border-top-color: #000000;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .btn-submit.loading .btn-text { display: none; }
        .btn-submit.loading .spinner { display: block; }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background-color: #020617;
            border: 1px solid var(--gray-border);
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }
            /* --- SUPPRIMER LE BLEU APK --- */
        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            outline: none;
        }
    </style>
</head>
<body>

    <div class="phone-container">

        <div></div> <div class="main-content">
            <div class="avatar-display-zone" id="avatarZone">
                <span class="avatar-placeholder" id="avatarPlaceholder">👤</span>
            </div>

            <p class="security-message" id="lblSecurityMsg">
                En raison de sécurité de l'app, vous devez saisir un code pour être le seul à accéder à vos données.
            </p>

            <div class="input-wrapper">
                <input type="password" id="appPassword" class="pin-input" placeholder="••••" pattern="[0-9]*" inputmode="numeric" maxlength="4">
                <button type="button" class="toggle-password" id="togglePasswordBtn">
                    <svg id="eyeIcon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path><path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path><line x1="2" y1="2" x2="22" y2="22"></line></svg>
                </button>
            </div>
        </div>

        <div class="bottom-action-container">
            <button class="btn-submit" id="submitBtn" disabled>
                <span class="btn-text" id="btnText">Continuer</span>
                <div class="spinner"></div>
            </button>
        </div>

    </div>

    <div id="toast" class="toast"></div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBm-P3nrCQxf5fcnWOeKdatJcXqy6P3oxo",
            authDomain: "tyti-deaee.firebaseapp.com",
            projectId: "tyti-deaee",
            storageBucket: "tyti-deaee.firebasestorage.app",
            messagingSenderId: "668655272910",
            appId: "1:668655272910:web:296794f893e36784d2619f",
            measurementId: "G-CRLKTT8R27"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const appPassword = document.getElementById('appPassword');
        const togglePasswordBtn = document.getElementById('togglePasswordBtn');
        const eyeIcon = document.getElementById('eyeIcon');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const avatarZone = document.getElementById('avatarZone');
        const toast = document.getElementById('toast');

        let firstPin = "";
        let isConfirmStage = false;
        let currentUserUid = null;

        let uiTranslations = {
            step1Msg: "En raison de sécurité de l'app, vous devez saisir un code pour être le seul à accéder à vos données.",
            step2Msg: "Veuillez ressaisir votre code PIN pour le confirmer.",
            errorLength: "Le code doit contenir exactement 4 chiffres.",
            errorMatch: "Les codes ne correspondent pas. Réessayez.",
            dbError: "Échec de l'enregistrement sur le serveur.",
            btnNext: "Continuer",
            btnConfirm: "Confirmer"
        };

        // Détection de la langue et chargement des textes
        document.addEventListener("DOMContentLoaded", () => {
            const currentLang = localStorage.getItem('tyti_lang') || 'fr';
            if (currentLang === 'en') {
                uiTranslations.step1Msg = "For security reasons, you must enter a code to be the only one accessing your data.";
                uiTranslations.step2Msg = "Please re-enter your PIN code to confirm it.";
                uiTranslations.errorLength = "The code must contain exactly 4 digits.";
                uiTranslations.errorMatch = "Codes do not match. Try again.";
                uiTranslations.dbError = "Failed to save to the server.";
                uiTranslations.btnNext = "Continue";
                uiTranslations.btnConfirm = "Confirm";
            } else if (currentLang === 'ja') {
                uiTranslations.step1Msg = "セキュリティ上の理由から、データにアクセスできる唯一のユーザーになるためにコードを入力する必要があります。";
                uiTranslations.step2Msg = "確認のため、もう一度PINコードを入力してください。";
                uiTranslations.errorLength = "コードは正確に4桁である必要があります。";
                uiTranslations.errorMatch = "コードが一致しません。もう一度お試しください。";
                uiTranslations.dbError = "サーバーへの保存に失敗しました。";
                uiTranslations.btnNext = "次へ";
                uiTranslations.btnConfirm = "確認";
            }
            document.getElementById('lblSecurityMsg').textContent = uiTranslations.step1Msg;
            btnText.textContent = uiTranslations.btnNext;
        });

        // Suivi de l'état d'authentification et récupération de l'avatar
        auth.onAuthStateChanged((user) => {
            if (user) {
                currentUserUid = user.uid;
                // Aller chercher l'image qui vient d'être mise à jour sur profil.html
                db.collection("users").doc(currentUserUid).get().then((doc) => {
                    if (doc.exists && doc.data().avatar) {
                        avatarZone.innerHTML = `<img src="${doc.data().avatar}" class="avatar-img" alt="Profil">`;
                    }
                });
            } else {
                window.location.href = "connect.html";
            }
        });

        // Activer/Désactiver le bouton selon la longueur saisie (doit être égal à 4)
        appPassword.addEventListener('input', () => {
            // Nettoyer pour garder uniquement les chiffres
            appPassword.value = appPassword.value.replace(/[^0-9]/g, '');

            if (appPassword.value.length === 4) {
                submitBtn.removeAttribute('disabled');
                submitBtn.classList.add('active');
            } else {
                submitBtn.setAttribute('disabled', 'true');
                submitBtn.classList.remove('active');
            }
        });

        // Gestion du bouton Continuer / Confirmer (Double Saisie)
        submitBtn.addEventListener('click', () => {
            if (!submitBtn.classList.contains('active') || submitBtn.classList.contains('loading')) return;

            const typedPin = appPassword.value.trim();

            if (typedPin.length !== 4 || isNaN(typedPin)) {
                showToast(uiTranslations.errorLength);
                return;
            }

            if (!isConfirmStage) {
                // ÉTAPE 1 : Première Saisie Réussie
                firstPin = typedPin;
                isConfirmStage = true;

                appPassword.value = ""; // Effacer l'input pour la confirmation
                submitBtn.setAttribute('disabled', 'true');
                submitBtn.classList.remove('active');

                document.getElementById('lblSecurityMsg').textContent = uiTranslations.step2Msg;
                btnText.textContent = uiTranslations.btnConfirm;
            } else {
                // ÉTAPE 2 : Saisie de Confirmation
                if (typedPin === firstPin) {
                    submitBtn.classList.add('loading');

                    // 1. Stockage Local Impeccable (Pour la vérification instantanée après le Splash)
                    localStorage.setItem('tyti_app_pin', typedPin);

                    // 2. Stockage sur la BDD Cloud (Firestore)
                    db.collection("users").doc(currentUserUid).update({
                        pinCode: typedPin,
                        pinUpdatedAt: new Date().toISOString()
                    })
                    .then(() => {
                        window.location.href = "conf.html"; // Redirection Accueil
                    })
                    .catch((error) => {
                        console.error("Erreur Firestore :", error);
                        showToast(uiTranslations.dbError);
                        submitBtn.classList.remove('loading');
                    });

                } else {
                    // Les codes ne correspondent pas, on réinitialise tout pour des raisons de sécurité
                    showToast(uiTranslations.errorMatch);
                    appPassword.value = "";
                    firstPin = "";
                    isConfirmStage = false;

                    submitBtn.setAttribute('disabled', 'true');
                    submitBtn.classList.remove('active');

                    document.getElementById('lblSecurityMsg').textContent = uiTranslations.step1Msg;
                    btnText.textContent = uiTranslations.btnNext;
                }
            }
        });

        // Visibilité du mot de passe
        togglePasswordBtn.addEventListener('click', () => {
            if (appPassword.type === "password") {
                appPassword.type = "text";
                eyeIcon.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`;
            } else {
                appPassword.type = "password";
                eyeIcon.innerHTML = `<path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path><path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path><line x1="2" y1="2" x2="22" y2="22"></line>`;
            }
        });

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3500);
        }
    </script>
</body>
</html>
